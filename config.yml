# Обратный отсчёт перед боем (сек)
countdown: 5
# Максимальная длительность дуэли (сек), потом ничья
max-time: 600
# Сколько секунд действует приглашение
request-timeout: 30
draft:
  # Интервал между драфтами (сек)
  interval: 30
  # Сколько секунд даётся на выбор улучшения
  pick-time: 12
# Арена задаётся командами /duel setarena 1 и /duel setarena 2
